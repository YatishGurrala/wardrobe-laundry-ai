<script>
        // Simple micro-interaction for the upload zone
        const uploadZone = document.querySelector('label');
        uploadZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadZone.classList.add('scale-[1.03]', 'border-tertiary/50');
        });
        
        uploadZone.addEventListener('dragleave', () => {
            uploadZone.classList.remove('scale-[1.03]', 'border-tertiary/50');
        });

        // Animation for the "Capture" text on hover
        uploadZone.addEventListener('mouseenter', () => {
            document.querySelector('.material-symbols-outlined').style.fontVariationSettings = "'FILL' 1, 'wght' 500";
        });

        uploadZone.addEventListener('mouseleave', () => {
            document.querySelector('.material-symbols-outlined').style.fontVariationSettings = "'FILL' 0, 'wght' 300";
        });
    </script>
