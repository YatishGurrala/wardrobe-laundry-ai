<style>
        /* Ambient Background Glow */
        .ambient-glow {
            position: fixed;
            top: -10%;
            left: -10%;
            width: 120%;
            height: 120%;
            background: radial-gradient(circle at 50% 30%, rgba(183, 177, 210, 0.03) 0%, rgba(13, 13, 13, 0) 70%);
            z-index: -1;
            pointer-events: none;
        }

        /* Fluid Image Reveal */
        .image-reveal {
            animation: revealImage 1.5s cubic-bezier(0.19, 1, 0.22, 1) forwards;
            opacity: 0;
            transform: scale(1.05);
        }
        @keyframes revealImage {
            0% { opacity: 0; transform: scale(1.05); }
            100% { opacity: 1; transform: scale(1); }
        }

        /* Staggered Text Reveal */
        .text-reveal-stagger > * {
            opacity: 0;
            transform: translateY(20px);
            animation: slideUpFade 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .text-reveal-stagger > *:nth-child(1) { animation-delay: 0.4s; }
        .text-reveal-stagger > *:nth-child(2) { animation-delay: 0.6s; }
        .text-reveal-stagger > *:nth-child(3) { animation-delay: 0.8s; }
        .text-reveal-stagger > *:nth-child(4) { animation-delay: 1.0s; }

        @keyframes slideUpFade {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* Glassmorphic Overlay */
        .glass-overlay {
            background: linear-gradient(to top, rgba(17, 20, 21, 1) 0%, rgba(17, 20, 21, 0.7) 40%, rgba(17, 20, 21, 0) 100%);
        }
    </style>
