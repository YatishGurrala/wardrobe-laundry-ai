<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&amp;display=swap" rel="stylesheet"/>

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        @keyframes scan {
            0% { transform: translateY(-100%); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translateY(100%); opacity: 0; }
        }
        .scanning-line {
            animation: scan 2.5s ease-in-out infinite;
            background: linear-gradient(to bottom, transparent, #c9c2e4, transparent);
        }
        .glass-panel {
            backdrop-filter: blur(24px);
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>

                "on-tertiary-fixed": "#1c1831",
                "surface-container-high": "#282a2c",
                "on-primary-container": "#7c7a7a",
                "on-secondary-fixed-variant": "#484742",
                "on-primary-fixed": "#1c1b1b",
                "on-secondary-container": "#b8b5ae",
                "surface-container-low": "#1a1c1d",
                "on-secondary-fixed": "#1c1c17",
                "inverse-primary": "#5f5e5e",
                "background": "#111415",
                "primary-fixed": "#e5e2e1",
                "tertiary-fixed": "#e5deff",
                "outline": "#8e9192",
                "secondary-fixed-dim": "#cac6bf",
                "outline-variant": "#444748",
                "on-surface-variant": "#c4c7c7",
                "tertiary": "#c9c2e4",
                "on-background": "#e2e2e4",

<style>
    body {
      min-height: max(884px, 100dvh);

  </head>
<body class="bg-background text-on-surface font-body-md antialiased min-h-screen">
<!-- Header: Shared Component TopAppBar Mapping -->
<header class="fixed top-0 w-full z-50 bg-surface/80 dark:bg-surface/80 backdrop-blur-xl border-b border-white/10 shadow-sm flex justify-between items-center px-gutter h-16">
<div class="flex items-center gap-4">
<button class="active:scale-95 duration-200 hover:opacity-80 transition-opacity">
<span class="material-symbols-outlined text-primary dark:text-primary-fixed">close</span>
</button>
<h1 class="font-headline-md text-headline-md font-semibold tracking-tight text-on-surface dark:text-on-surface">Add Clothing Item</h1>
</div>
<div class="flex items-center gap-4">
<div class="w-8 h-8 rounded-full bg-surface-container-highest overflow-hidden border border-white/10">
<img alt="User profile avatar" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCw9C0iA07RzQDqtGEE-t9TOOfvOmeTzeBJY64dhaTrb9TaluECotWCZBzJDbdzg0ayQROnlRof_kfLaeWb4u1pRqbJg1N_6sJ8fBCDdvFfy6I8LTUfHL0b1xTIhq1h5q8NS2hXVb2_yW0EkdUmp4Y5r45Lm-WEwjc8rQtTuVtKK7NTsmo45Nic8Ux8QX3GntOrXWllLyu858IfWWD3s0m2J1O2NfwP3ngxJAgq0tSaQEbC_vkaQq-hi6DBilT6-ic4EljHjqOsQ2k"/>
</div>
</div>
</header>
<!-- Main Content Canvas -->
<main class="pt-24 pb-32 px-gutter max-w-lg mx-auto min-h-screen flex flex-col gap-lg">
<!-- Step Indicator -->
<div class="flex flex-col gap-xs">
<div class="flex justify-between items-end">
<span class="font-label-md text-label-md text-on-surface-variant">Step 2 of 6</span>
<span class="font-label-sm text-label-sm text-tertiary">AI Auto-detection</span>
</div>
<div class="h-1 w-full bg-surface-container-high rounded-full overflow-hidden">
<div class="h-full bg-tertiary w-1/3 transition-all duration-700 ease-out"></div>
</div>
</div>
<!-- Preview Image Section -->
<div class="relative w-full aspect-[3/4] rounded-xl overflow-hidden glass-panel group shadow-2xl">
<img class="w-full h-full object-cover opacity-80" data-alt="A professional studio photograph of a long, charcoal grey trench coat with elegant tailoring. The lighting is cinematic and moody, emphasizing the texture of the high-quality wool fabric. The background is a deep matte black, creating a high-contrast and minimalist aesthetic that feels like a luxury fashion editorial. Subtle lens flares and soft light leaks in muted lavender tones enhance the premium atmosphere." src="https://lh3.googleusercontent.com/aida-public/AB6AXuANDkyCjozDqiQj8N9czcCZn-ybwZcpIbxmQe4eiT6PUPmo3fGlmjWgfBT5DWA585clbuZrGVsT8_yAQtwRtPpeRjdPWH2p_JcVY6OEwOs_VgL2g6tl5NjUlwNR5cZJaw-tkNTlQhFHkcramV-zxrf6yZNRXBfQUfUnrzER4nhUPnF06Njd3wwDB_IQNkvtHtRT4nzVUrqCc9s2F94MZno5WWyWBFv7XR-kTkLdHbL4ATs4LmSGXZrzlTuEGnzDasBredwpY8iG_DM"/>
<!-- Scanning Animation -->
<div class="absolute inset-0 z-10 pointer-events-none">
<div class="scanning-line absolute top-0 left-0 w-full h-1/4"></div>
</div>
<!-- Glassmorphic Overlay -->
<div class="absolute inset-0 flex items-center justify-center z-20">
<div class="glass-panel px-md py-sm rounded-full flex items-center gap-3 animate-pulse">
<span class="material-symbols-outlined text-tertiary animate-spin text-[20px]" style="animation-duration: 3s;">auto_awesome</span>
<span class="font-label-md text-label-md text-on-surface">AI analyzing...</span>
</div>
</div>
</div>
<!-- AI Result Card -->
<div class="glass-panel p-lg rounded-xl flex flex-col gap-md relative overflow-hidden">
<!-- Subtle Radial Glow -->
<div class="absolute -top-12 -right-12 w-32 h-32 bg-tertiary/10 blur-3xl rounded-full"></div>
<div class="flex flex-col gap-xs">
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-widest">Category Detected</span>
<div class="flex items-center justify-between">
<h2 class="font-headline-lg text-headline-lg text-on-surface">Outerwear</h2>
<div class="bg-tertiary/10 px-3 py-1 rounded-full border border-tertiary/20 flex items-center gap-1.5">
<span class="material-symbols-outlined text-[14px] text-tertiary" style="font-variation-settings: 'FILL' 1;">verified</span>
<span class="font-label-sm text-label-sm text-tertiary">98% Match</span>
</div>
</div>
</div>
<div class="grid grid-cols-2 gap-md">
<div class="flex flex-col gap-xs">
<span class="font-label-sm text-label-sm text-on-surface-variant">Primary Color</span>
<div class="flex items-center gap-2">
<div class="w-4 h-4 rounded-full bg-[#2C2C2C] border border-white/20"></div>
<span class="font-body-md text-body-md">Charcoal Grey</span>
</div>
</div>
<div class="flex flex-col gap-xs">
<span class="font-label-sm text-label-sm text-on-surface-variant">Sub-category</span>
<span class="font-body-md text-body-md">Trench Coat</span>
</div>
</div>
<button class="mt-2 text-tertiary font-label-md text-label-md text-left hover:underline transition-all">
                Not quite right? Edit manually
            </button>
</div>
<!-- Action Footer -->
<div class="fixed bottom-0 left-0 right-0 p-gutter bg-gradient-to-t from-background via-background/95 to-transparent z-40">
<div class="max-w-lg mx-auto">
<button class="w-full bg-white text-black font-label-md text-label-md py-4 rounded-lg shadow-lg active:scale-95 transition-all duration-200 flex items-center justify-center gap-2">
                    Confirm &amp; Next
                    <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</div>
</div>
</main>
<!-- Navigation Shell Suppression: As per "Semantic Shell Mandate", 
         BottomNavBar is suppressed because this is a focused "Add Item" journey (Transactional). -->
<script>
        // Micro-interaction for the "AI analyzing" state transition
        document.addEventListener('DOMContentLoaded', () => {
            const overlay = document.querySelector('.animate-pulse');
            const scanningLine = document.querySelector('.scanning-line');
            
            // Simulate completion after 3 seconds
            setTimeout(() => {
                if(overlay) {
                    overlay.classList.remove('animate-pulse');
                    overlay.innerHTML = `
                        <span class="material-symbols-outlined text-tertiary text-[20px]" style="font-variation-settings: 'FILL' 1;">check_circle</span>
                        <span class="font-label-md text-label-md text-on-surface">Analysis Complete</span>
                    `;
                    overlay.classList.add('bg-tertiary/20', 'border-tertiary/40');
                }
                if(scanningLine) {
                    scanningLine.style.display = 'none';
                }
            }, 3000);
        });
    </script>
</body></html>
