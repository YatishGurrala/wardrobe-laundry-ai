<style>
        /* Custom Animations for Scanning Effect */
        @keyframes scanline {
            0% { transform: translateY(-100%); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(300px); opacity: 0; }
        }
        .animate-scanline {
            animation: scanline 3s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }

        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 20px 0px rgba(201, 194, 228, 0.1); }
            50% { box-shadow: 0 0 30px 5px rgba(201, 194, 228, 0.2); }
        }
        .animate-pulse-glow {
            animation: pulse-glow 2s ease-in-out infinite;
        }

        /* Hide scrollbars for clean UI */
        ::-webkit-scrollbar { display: none; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);

<body class="bg-background text-on-surface h-screen w-full overflow-hidden flex flex-col relative font-body-md select-none">
<!-- Camera Viewport Canvas -->
<div class="absolute inset-0 z-0">

</div>

</button>
<div class="px-sm py-xs rounded-full bg-surface-container/60 backdrop-blur-xl border border-outline-variant/20 flex items-center gap-base">
<span class="w-2 h-2 rounded-full bg-tertiary animate-pulse"></span>
<span class="font-label-sm text-label-sm text-on-surface tracking-widest uppercase">Auto</span>
</div>
<button class="w-12 h-12 rounded-full bg-surface-container/60 backdrop-blur-xl border border-outline-variant/20 flex items-center justify-center text-on-surface hover:bg-surface-container-high transition-colors active:scale-95">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">flash_off</span>
</button>
</header>
<!-- Scanning Reticle & Animation -->
<main class="relative z-10 flex-1 flex items-center justify-center pointer-events-none">
<div class="w-72 h-80 relative">

<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 flex flex-col items-center gap-sm opacity-50">
<span class="material-symbols-outlined text-primary/80" style="font-variation-settings: 'FILL' 0;">center_focus_weak</span>
</div>
</div>
