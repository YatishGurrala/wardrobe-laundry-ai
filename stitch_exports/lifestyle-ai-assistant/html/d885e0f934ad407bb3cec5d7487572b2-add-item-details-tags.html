<!-- Interactions -->
<script>
        // Micro-interaction for color selection
        document.querySelectorAll('button[class*="pl-2 pr-4"]').forEach(button => {
            button.addEventListener('click', () => {
                const isActive = button.classList.contains('border-primary');
                // Reset others
                document.querySelectorAll('button[class*="pl-2 pr-4"]').forEach(btn => {
                    btn.classList.remove('border-primary', 'bg-primary/10');
                    btn.querySelector('.material-symbols-outlined').style.opacity = '0';
                });
                
                if (!isActive) {
                    button.classList.add('border-primary', 'bg-primary/10');
                    button.querySelector('.material-symbols-outlined').style.opacity = '1';
                }
            });
        });

        // Floating ambient light effect
        document.addEventListener('mousemove', (e) => {
            const x = (e.clientX / window.innerWidth) * 100;
            const y = (e.clientY / window.innerHeight) * 100;
            document.body.style.backgroundImage = `radial-gradient(circle at ${x}% ${y}%, rgba(183, 177, 210, 0.03) 0%, transparent 40%)`;
        });
    </script>
<!-- Background Pattern -->
